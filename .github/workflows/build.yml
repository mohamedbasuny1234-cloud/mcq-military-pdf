name: Build MCQ PDF
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python generate_mcq.py
      - uses: actions/upload-artifact@v4
        with:
          name: mcq-pdf
          path: MCQ_Military_Book.pdf
